name: Unsigned release candidates

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install strawberryperl nasm poppler -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install pypdf==6.10.0 pdfplumber==0.11.9 Pillow==12.2.0
      - shell: pwsh
        run: .\scripts\prepare-typst-runtime.ps1
      - run: python scripts/run-release-qa.py
      - run: pnpm tauri build --bundles nsis --ci
      - name: Smoke test Windows install and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          .\scripts\test-windows-installer.ps1 -CurrentInstaller $installer.FullName -ReportPath src-tauri\target\release\bundle\nsis\installer-smoke-report.json
      - name: Write Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content src-tauri\target\release\bundle\nsis\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TradeDesk-Windows-x64-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/installer-smoke-report.json
            output/release-qa/0.26.0/**
          if-no-files-found: error

  macos-dmg:
    name: macOS ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: python3 -m pip install pypdf==6.10.0 pdfplumber==0.11.9 Pillow==12.2.0
      - run: bash scripts/setup-macos-dev.sh
      - run: brew install poppler
      - run: python3 scripts/run-release-qa.py
      - name: Record macOS platform
        run: |
          mkdir -p output/release-qa/0.26.0
          {
            sw_vers
            printf 'Architecture: '
            uname -m
          } > output/release-qa/0.26.0/platform-${{ matrix.architecture }}.txt
      - run: pnpm tauri build --bundles app,dmg --ci --no-sign
      - run: bash scripts/verify-macos-bundle.sh
      - name: Write macOS checksums
        run: shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg > src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TradeDesk-macOS-${{ matrix.architecture }}-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
            output/release-qa/0.26.0/**
          if-no-files-found: error
