name: Unsigned release candidates

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install strawberryperl nasm -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - shell: pwsh
        run: .\scripts\prepare-typst-runtime.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --bundles nsis --ci
      - name: Write Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content src-tauri\target\release\bundle\nsis\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TradeDesk-Windows-x64-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: bash scripts/setup-macos-dev.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --bundles app,dmg --ci --no-sign
      - name: Write macOS checksums
        run: shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg > src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TradeDesk-macOS-arm64-unsigned
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
