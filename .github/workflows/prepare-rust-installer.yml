name: Prepare Rust installer

on:
  push:
    paths:
      - .github/workflows/prepare-rust-installer.yml

jobs:
  split-rustup:
    runs-on: windows-latest
    steps:
      - name: Download official rustup installer
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" `
            -OutFile "rustup-init.exe"
          Get-FileHash rustup-init.exe -Algorithm SHA256

      - name: Split into browser-sized parts
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("rustup-init.exe")
          $chunkSize = 4MB
          for ($index = 0; $index -lt 4; $index++) {
            $offset = $index * $chunkSize
            $count = [Math]::Max(0, [Math]::Min($chunkSize, $bytes.Length - $offset))
            $part = if ($count -gt 0) { $bytes[$offset..($offset + $count - 1)] } else { [byte[]]@() }
            [System.IO.File]::WriteAllBytes("rustup-init.part$index", $part)
          }
          Set-Content -Path rustup-init.sha256 -Value (Get-FileHash rustup-init.exe -Algorithm SHA256).Hash

      - name: Upload part 0
        uses: actions/upload-artifact@v4
        with:
          name: rustup-part-0
          path: rustup-init.part0
          compression-level: 0

      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: rustup-part-1
          path: rustup-init.part1
          compression-level: 0

      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: rustup-part-2
          path: rustup-init.part2
          compression-level: 0

      - name: Upload part 3
        uses: actions/upload-artifact@v4
        with:
          name: rustup-part-3
          path: rustup-init.part3
          compression-level: 0

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: rustup-checksum
          path: rustup-init.sha256
