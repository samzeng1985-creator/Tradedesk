<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../src/styles.css" />
  <style>
    body { margin: 0; padding: 24px; background: white; }
    .fixture { width: 1100px; }
  </style>
</head>
<body>
  <div class="fixture">
    <div class="table-toolbar purchase-output-toolbar">
      <label><span class="sr-only">搜索采购单</span><input placeholder="按采购单号、业务单或供应商搜索" /></label>
      <div class="toolbar-buttons">
        <label class="export-language" id="purchase-company">采购方<select><option>TradeDesk RC2 UI QA</option></select></label>
        <label class="export-language">签章<select><option>不使用</option></select></label>
        <span class="record-count">1 张采购单</span>
      </div>
    </div>
  </div>
  <script>
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const label = document.querySelector("#purchase-company");
      const rectangle = label.getBoundingClientRect();
      document.body.dataset.labelHeight = rectangle.height.toFixed(2);
      document.body.dataset.labelWidth = rectangle.width.toFixed(2);
      document.body.dataset.whiteSpace = getComputedStyle(label).whiteSpace;
      document.body.dataset.passed = String(rectangle.height <= 60 && getComputedStyle(label).whiteSpace === "nowrap");
    }));
  </script>
</body>
</html>
